<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>homerseklet_adatok</title>
  </head>
  <body>

    <h1>Hőmérséklet adatok</h1>


    <form id="weatherForm">
      <label for="nap">Add meg a napot</label><br>
      <input type="text" id="nap" name="day"><br>
      <label for="temp">Add meg hány fok volt aznap</label><br>
      <input type="number" id="temp" name="temperature"><br>
      <button type="submit" id="kuldes">Küldés</button>
    </form>

    <div class="container">
      <table id="weatherTable" class="table-bordered">
        
        <tbody id="idojaras">
          <th id="thnap">Nap</th>
          <th id="thtemp">Időjárás</th>
        </tbody>
      </table>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
